version: 2

sources:
  - name: raw
    schema: gz_raw_data
    description: Greenweez raw data source

    tables:
      - name: sales
        identifier: raw_gz_sales
        description: Raw sales transaction data

        config:
          loaded_at_field: "cast(date_date as timestamp)"
          freshness:
            warn_after:
              count: 90
              period: day

        columns:
          - name: date_date
            description: Date of the sale

          - name: orders_id
            description: Order identification number
            data_tests:
              - not_null

          - name: pdt_id
            description: Product identification number
            data_tests:
              - not_null

          - name: revenue
            description: Revenue generated from the order

          - name: quantity
            description: Quantity of products sold

      - name: product
        identifier: raw_gz_product
        description: Raw product details and cost info

        columns:
          - name: products_id
            description: Unique product identification number
            data_tests:
              - unique
              - not_null

          - name: purchSE_price
            description: Purchase price of the product

      - name: ship
        identifier: raw_gz_ship
        description: Raw shipping fee and shipping cost data

        columns:
          - name: orders_id
            description: Unique order identification number
            data_tests:
              - unique
              - not_null

          - name: shipping_fee
            description: Shipping fee charged to the customer

          - name: shipping_fee_1
            description: Duplicate shipping fee column

          - name: logCost
            description: Logistics cost

          - name: ship_cost
            description: Shipping cost
      - name: adwords
        identifier: raw_gz_adwords
      - name: bing
        identifier: raw_gz_bing
      - name: criteo
        identifier: raw_gz_criteo
      - name: facebook
        identifier: raw_gz_facebook
models:
  - name: int_campaigns
    description: "UNION ALL ile birleştiren ara model."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date_date
              - paid_source
              - campaign_key
    columns:
      - name: date_date
        tests:
          - not_null
      - name: paid_source
        tests:
          - not_null
      - name: campaign_key
        tests:
          - not_null
      - name: ads_cost
        tests:
          - not_null
      - name: impression
        tests:
          - not_null
      - name: click
        tests:
          - not_null

  - name: int_campaigns_day
    description: "Reklam kampanyalarinin günlük bazda toplanmiş versiyonudur"
    columns:
      - name: date_date
        description: "Kampanya tarihi"
        tests:
          - unique
          - not_null
      - name: ads_cost
        description: "Günlük toplam reklam maliyeti"
      - name: ads_impression
        description: "Günlük toplam gösterim sayisi"
      - name: ads_clicks
        description: "Günlük toplam tiklama sayisi"

  - name: finance_campaigns_day
    description: "Günlük finans verisi ile reklam harcamalarini birleştiren mart modeli. ads_margin = operational_margin - ads_cost"
    columns:
      - name: date
        description: "Tarih"
        tests:
          - unique
          - not_null
      - name: ads_margin
        description: "Operasyonel marjdan reklam maliyeti çikarilmiş değer"
      - name: ads_cost
        description: "Günlük toplam reklam maliyeti"
      - name: ads_impression
        description: "Günlük toplam gösterim sayisi"
      - name: ads_clicks
        description: "Günlük toplam tiklama sayisi"

  - name: finance_campaigns_month
    description: "Finans ve reklam verilerinin aylik toplami. ads_margin = operational_margin - ads_cost"
    columns:
      - name: datemonth
        description: "Ayin ilk günü"
        tests:
          - unique
          - not_null
      - name: ads_margin
        description: "Aylik toplam reklam marji"